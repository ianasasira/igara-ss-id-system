# /etc/nginx/sites-available/idstudio   (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx)
# Replace ids.example.com with your domain, then run:  sudo certbot --nginx -d ids.example.com   (adds HTTPS)
server {
    listen 80;
    server_name ids.example.com;

    client_max_body_size 300m;          # photo uploads
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
